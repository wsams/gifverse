name: Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      force-docker-build:
        description: 'Force Docker build even if no new release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Node.js dependencies
        run: npm install

      - name: Verify semantic-release installation
        run: npx semantic-release --version --config config/.releaserc.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release --config config/.releaserc.json

  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: release
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fetch all tags
      run: git fetch --tags

    - name: List available tags
      run: |
        echo "Available Git tags:"
        git tag --sort=-version:refname | head -10
        echo "Latest commit:"
        git log --oneline -1

    - name: Extract version from latest tag
      id: version
      run: |
        LATEST_TAG=$(git describe --tags --abbrev=0)
        echo "Latest tag: $LATEST_TAG"
        # Remove 'v' prefix if present
        VERSION=${LATEST_TAG#v}
        echo "Version: $VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "MAJOR_MINOR=$(echo $VERSION | cut -d. -f1-2)" >> $GITHUB_OUTPUT
        echo "MAJOR=$(echo $VERSION | cut -d. -f1)" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/gifverse
        tags: |
          type=raw,value=${{ steps.version.outputs.VERSION }}
          type=raw,value=${{ steps.version.outputs.MAJOR_MINOR }}
          type=raw,value=${{ steps.version.outputs.MAJOR }}
          type=raw,value=latest

    - name: Show generated tags
      run: |
        echo "Generated Docker tags:"
        echo "${{ steps.meta.outputs.tags }}"
        echo "JSON format:"
        echo "${{ steps.meta.outputs.json }}"

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max


    - name: Output image details
      run: |
        echo "Built and pushed Docker image with tags:"
        echo "${{ steps.meta.outputs.tags }}"
        echo "Digest: ${{ steps.build.outputs.digest }}"
