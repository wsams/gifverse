name: Test Docker Image

on:
  push:
    branches: [ main, master, develop, feature/* ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short

  test-docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t gifverse-test .

    - name: Test Docker image health
      run: |
        # Start the container in the background
        docker run -d --name gifverse-test -p 5000:5000 gifverse-test

        # Wait for the container to start
        sleep 10

        # Test the health endpoint
        curl -f http://localhost:5000/ || exit 1

        # Test the gallery endpoint
        curl -f http://localhost:5000/gallery || exit 1

        # Clean up
        docker stop gifverse-test
        docker rm gifverse-test

    - name: Test Docker image with sample GIF
      run: |
        # Create a test GIF
        python3 -c "
        from PIL import Image, ImageDraw
        import os

        # Create a simple animated GIF
        frames = []
        for i in range(5):
            img = Image.new('RGB', (100, 100), (255, 255, 255))
            draw = ImageDraw.Draw(img)
            draw.ellipse([20+i*10, 20+i*10, 80-i*10, 80-i*10], fill=(255, 0, 0))
            frames.append(img)

        frames[0].save('test.gif', save_all=True, append_images=frames[1:], duration=100, loop=0)
        "

        # Start the container
        docker run -d --name gifverse-test -p 5000:5000 -v $(pwd):/test gifverse-test

        # Wait for the container to start
        sleep 10

        # Test uploading a GIF
        curl -X POST -F "file=@test.gif" http://localhost:5000/process

        # Clean up
        docker stop gifverse-test
        docker rm gifverse-test
        rm test.gif
